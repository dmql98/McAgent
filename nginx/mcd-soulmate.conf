# ============================================================
# 「麦门知己」Nginx 站点配置模板
#
# 用法：
#   1. 把所有 your-domain.com 改成你的域名
#   2. 把所有 /var/www/mcd-soulmate 改成你的实际部署路径
#   3. sudo cp nginx/mcd-soulmate.conf /etc/nginx/sites-available/
#   4. sudo ln -s /etc/nginx/sites-available/mcd-soulmate.conf /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. sudo certbot --nginx -d your-domain.com    # 自动加 HTTPS
#
# 部署红线（PRD §8）：全站必须 HTTPS，否则 Cookie 会明文传输。
# ============================================================

# ---------- HTTP → HTTPS 跳转（certbot 会自动改写这一段） ----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # certbot 的 ACME 校验路径必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/mcd-soulmate/web;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # ---- TLS（certbot 会自动填这两行） ----
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 静态前端 ----
    root /var/www/mcd-soulmate/web;
    index index.html;

    # 静态资源长缓存（带 hash 的文件可以更久，这里统一 7 天）
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # index.html 绝不缓存 —— 否则更新后用户看到旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ============================================================
        # SSE 关键配置（少了这几行，流式回复会一次性蹦出来，甚至卡死）
        # ============================================================
        proxy_buffering off;          # 不缓冲，事件立即下发
        proxy_cache off;              # 不缓存 SSE
        proxy_read_timeout 120s;      # 对话可能跑很久（MCP + LLM）
        proxy_send_timeout 120s;
        proxy_set_header Connection '';   # 清掉 Connection 头，保持长连接

        # 不要在 SSE 上做 gzip，会破坏分帧
        gzip off;
    }

    # 健康检查单独放行，不打日志（避免 pm2 / 监控刷爆 access.log）
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # CSP：只允许同源 + 麦当劳支付域名跳转。
    # 注意 'unsafe-inline' 是因为页面用了内联 style（支付卡片动态改 opacity），
    # 若要彻底去掉需把内联样式改为 class 切换。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---- gzip（静态资源用，SSE 已单独关掉） ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 上传体积上限（本项目只有对话，给 256k 足够）
    client_max_body_size 256k;

    access_log /var/log/nginx/mcd-soulmate.access.log;
    error_log  /var/log/nginx/mcd-soulmate.error.log warn;
}
